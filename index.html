<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Storage & Drive Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4 sm:p-8 font-sans">

  <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl">
    <div class="mb-6">
      <h1 class="text-2xl font-bold text-emerald-400">Video Storage & Drive Calculator</h1>
      <p class="text-sm text-slate-400 mt-1">Calcola lo spazio necessario e l'hardware consigliato per la tua produzione.</p>
    </div>

    <!-- Form Inputs -->
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1 text-slate-300">Formato / Codec</label>
        <select id="codecSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
          <option value="prores_422_hq">Apple ProRes 422 HQ (4K UHD)</option>
          <option value="prores_raw">ProRes RAW / CinemaDNG (4K)</option>
          <option value="all_intra_10bit">H.265 / All-Intra 10-bit (4K 4:2:2)</option>
          <option value="long_gop_4k">H.264 / H.265 Long-GOP (4K Standard)</option>
          <option value="prores_proxy">Apple ProRes Proxy (Montaggio leggero)</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Frame Rate</label>
          <select id="fpsSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
            <option value="25">24 / 25 fps</option>
            <option value="50">50 / 60 fps</option>
            <option value="120">100 / 120 fps (Slow-mo)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium mb-1 text-slate-300">Ore stimate di girato</label>
          <input type="number" id="hoursInput" value="3" min="0.5" step="0.5" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-200 focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <button onclick="runCalculator()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-lg transition duration-200 mt-2">
        Calcola Requisiti Archiviazione
      </button>
    </div>

    <!-- Output Box -->
    <div id="resultsCard" class="hidden mt-6 pt-6 border-t border-slate-700 space-y-4">
      <div class="grid grid-cols-2 gap-4 text-center">
        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
          <span class="text-xs text-slate-400 uppercase tracking-wider">Spazio Richiesto</span>
          <p id="totalStorageDisplay" class="text-xl font-extrabold text-emerald-400 mt-1">--</p>
        </div>
        <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
          <span class="text-xs text-slate-400 uppercase tracking-wider">Bitrate Medio</span>
          <p id="bitrateDisplay" class="text-xl font-bold text-slate-200 mt-1">--</p>
        </div>
      </div>

      <!-- Affiliate Product Box -->
      <div class="bg-slate-900 border border-emerald-500/30 rounded-xl p-4 mt-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wide">Supporto Consigliato</span>
          <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded border border-slate-700">Testato per il bitrate selezionato</span>
        </div>
        <h3 id="recommendationTitle" class="text-base font-semibold text-white">--</h3>
        <p id="recommendationDesc" class="text-xs text-slate-400 mt-1 leading-relaxed">--</p>
        
        <a id="affiliateBtn" href="#" target="_blank" rel="nofollow noopener" class="mt-3 inline-flex items-center justify-center w-full bg-slate-100 hover:bg-white text-slate-950 font-semibold text-sm py-2 px-4 rounded-lg transition">
          Vedi disponibilità e prezzo su Amazon
          <svg class="w-4 h-4 ml-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    const BITRATE_SPECS = {
      prores_422_hq: { base: 220, label: "Apple ProRes 422 HQ" },
      prores_raw: { base: 450, label: "ProRes RAW / CinemaDNG" },
      all_intra_10bit: { base: 200, label: "H.265 All-Intra 10-bit" },
      long_gop_4k: { base: 100, label: "H.264/H.265 Long-GOP" },
      prores_proxy: { base: 45, label: "Apple ProRes Proxy" }
    };

    // ID Provvisorio (lo aggiorneremo nel passo dell'affiliazione)
    const AMAZON_TAG = "videotool-21";

    function runCalculator() {
      const codec = document.getElementById("codecSelect").value;
      const fps = parseFloat(document.getElementById("fpsSelect").value);
      const hours = parseFloat(document.getElementById("hoursInput").value) || 1;

      const spec = BITRATE_SPECS[codec];
      let multiplier = 1;
      if (fps >= 100) multiplier = 4.8;
      else if (fps >= 50) multiplier = 2.4;

      const mbps = spec.base * multiplier;
      const totalGB = Math.round(((mbps / 8) * 3600 * hours) / 1000);
      const totalTB = (totalGB / 1000).toFixed(2);

      // Mostra risultati
      document.getElementById("resultsCard").classList.remove("hidden");
      document.getElementById("totalStorageDisplay").innerText = totalGB >= 1000 ? `${totalTB} TB` : `${totalGB} GB`;
      document.getElementById("bitrateDisplay").innerText = `~${mbps} Mbps`;

      // Logica raccomandazione disco
      const titleElem = document.getElementById("recommendationTitle");
      const descElem = document.getElementById("recommendationDesc");
      const linkElem = document.getElementById("affiliateBtn");

      let query = "";
      if (totalGB <= 600) {
        titleElem.innerText = "SSD Portatile 1TB ad Alta Velocità (1050 MB/s)";
        descElem.innerText = "Ottimo per sessioni corte o riprese dirette in mobilità tramite USB-C.";
        query = "ssd portatile 1tb sanDisk extreme samsung t7";
      } else if (totalGB <= 2200) {
        titleElem.innerText = "SSD Portatile 2TB / 4TB Rugged Pro (2000 MB/s)";
        descElem.innerText = "Scrittura sostenuta elevata per evitare drop-frame durante recording ProRes o All-Intra.";
        query = "ssd portatile 2tb 2000mb/s nvme";
      } else {
        titleElem.innerText = "Storage RAID Desktop o NAS 2-Bay (8TB - 16TB)";
        descElem.innerText = "Volume di dati critico. Necessario un sistema desktop ridondato per salvare il master.";
        query = "nas synology 2 bay hard disk ironwolf";
      }

      linkElem.href = `https://www.amazon.it/s?k=${encodeURIComponent(query)}&tag=${AMAZON_TAG}`;
    }
  </script>
</body>
</html>
